version: "3.9"

services:
  api:
    build: ./backend
    container_name: pecuaria_api
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      - db
    environment:
      - DATABASE_URL=mysql+pymysql://user:password@db:3306/pecuaria

  db:
    image: mysql:8
    container_name: pecuaria_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: pecuaria
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"